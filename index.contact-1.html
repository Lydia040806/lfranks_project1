<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Contact</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #222;
            background: #fff;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        #container,
        nav,
        footer {
            width: min(860px, calc(100% - 32px));
            margin: 0 auto;
        }

        header {
            padding: 20px 0 8px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
            padding: 12px 0;
            border-block: 1px solid #bbb;
        }

        nav a {
            color: #24558a;
        }

        nav a:focus-visible {
            outline: 2px solid #24558a;
            outline-offset: 3px;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(180px, 1fr);
            gap: 32px;
            padding: 20px 0 28px;
        }

        footer {
            border-top: 1px solid #bbb;
            color: #555;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            main {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            main aside {
                border-top: 1px solid #bbb;
                padding-top: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="container">
        <header>
            <h1>Quick movie summaries</h1>
        </header>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="index.page2.html">Page 2</a>
            <a href="index.page3.html">Page 3</a>
            <a href="index.contact-1.html">Contact</a>
        </nav>
        <main>
            <section aria-labelledby="contact-title">
                <h2 id="contact-title">Contact</h2>
                <p>If you have any questions or comments about the Quick Movie Summaries website, feel free to get in touch.</p>
            </section>
            <aside>
                <h2>Email</h2>
                <p><a href="mailto:frankslydia5@gmail.com">frankslydia5@gmail.com</a></p>
            </aside>
        </main>
    </div>
    <nav aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="index.page2.html">Page 2</a>
        <a href="index.page3.html">Page 3</a>
        <a href="index.contact-1.html">Contact</a>
    </nav>
    <footer>
        <p>Copyright &copy; 2026 Quick Movie Summaries. All rights reserved.</p>
    </footer>
</body>
</html>
